<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Очки - Примерка 3D моделей</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* Видео на заднем плане */
        #video-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; 
        }
        video { 
            width: 100%; height: 100%; object-fit: cover; 
            transform: scaleX(-1); /* Зеркалим видео */
        }
        
        /* Canvas с 3D очками поверх видео */
        canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; 
            pointer-events: none; /* Чтобы клики проходили сквозь канвас */
        }

        /* Панель настроек */
        #controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); padding: 20px; border-radius: 15px;
            color: white; display: flex; flex-direction: column; gap: 15px; align-items: center; z-index: 10;
            border: 1px solid #444; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .controls-row {
            display: flex; gap: 25px; align-items: center; width: 100%; justify-content: center;
        }
        .control-group { text-align: center; }
        label { font-size: 14px; display: block; margin-bottom: 5px; font-weight: bold; }
        input[type=range] { cursor: pointer; }
        
        /* Стили для выбора моделей */
        .model-selector {
            display: flex; gap: 10px; margin-top: 5px; justify-content: center;
        }
        .model-btn {
            background: #222; color: white; border: 1px solid #555;
            padding: 8px 16px; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 500; transition: all 0.25s ease;
        }
        .model-btn:hover {
            background: #3c3c3c; border-color: #aaa;
        }
        .model-btn.active {
            background: #007bff; border-color: #007bff;
            box-shadow: 0 0 12px rgba(0, 123, 255, 0.6);
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 24px; pointer-events: none; text-align: center; z-index: 20;
            background: rgba(0,0,0,0.7); padding: 20px 40px; border-radius: 10px;
        }
    </style>

    <!-- Библиотеки -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="video-container"><video id="input_video" playsinline></video></div>
    <div id="loading">Загрузка нейросети и модели...<br><small>Пожалуйста, подождите</small></div>

    <!-- Панель управления -->
    <div id="controls" style="display:none;">
        <div class="controls-row">
            <div class="control-group">
                <label>Размер очков: <span id="scaleVal">1.0</span></label>
                <input type="range" id="scaleRange" min="0.01" max="0.2" step="0.001" value="0.05">
            </div>
            <div class="control-group">
                <label>Поворот (Y): <span id="rotVal">0</span></label>
                <input type="range" id="rotRange" min="-3.14" max="3.14" step="0.1" value="0">
            </div>
        </div>
        <div class="control-group" style="width: 100%;">
            <label>Выбор модели очков:</label>
            <div class="model-selector">
                <button class="model-btn active" data-model="model1.glb">Модель 1</button>
                <button class="model-btn" data-model="model2.glb">Модель 2</button>
                <button class="model-btn" data-model="model3.glb">Модель 3</button>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const loadingText = document.getElementById('loading');
        const controlsDiv = document.getElementById('controls');

        // --- 1. Сцена Three.js ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 1; 
        
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); 
        document.body.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(0, 2, 5);
        scene.add(dirLight);

        const glassesGroup = new THREE.Group();
        scene.add(glassesGroup);

        // Переменные для плавности
        let targetPos = new THREE.Vector3();
        let currentScale = 0.05;
        let targetScale = 0.05;
        let currentModel = null;

        // --- 2. Логика загрузки моделей ---
        const loader = new THREE.GLTFLoader();

        function loadModel(modelPath) {
            loadingText.innerHTML = "Загрузка модели " + modelPath + "...<br><small>Пожалуйста, подождите</small>";
            loadingText.style.display = 'block';

            loader.load(modelPath, function (gltf) {
                // Очистка предыдущей модели и её ресурсов
                if (currentModel) {
                    glassesGroup.remove(currentModel);
                    currentModel.traverse((node) => {
                        if (node.isMesh) {
                            if (node.geometry) node.geometry.dispose();
                            if (node.material) {
                                if (Array.isArray(node.material)) {
                                    node.material.forEach(m => m.dispose());
                                } else {
                                    node.material.dispose();
                                }
                            }
                        }
                    });
                }

                currentModel = gltf.scene;
                
                // Центрируем модель внутри группы
                const box = new THREE.Box3().setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                currentModel.position.sub(center);

                glassesGroup.add(currentModel);
                loadingText.style.display = 'none';
                controlsDiv.style.display = 'flex';
                
            }, undefined, function (err) {
                loadingText.innerHTML = "Ошибка загрузки " + modelPath + "!<br><small>Проверьте наличие файла или выберите другую модель</small>";
                console.error(err);
                
                // Скрываем ошибку через 3 секунды, если какая-то модель уже загружена
                setTimeout(() => {
                    if (currentModel) {
                        loadingText.style.display = 'none';
                    }
                }, 3000);
            });
        }

        // Загружаем первую модель по умолчанию
        loadModel('model1.glb');

        // Навешиваем обработчики на кнопки переключения моделей
        const buttons = document.querySelectorAll('.model-btn');
        buttons.forEach(button => {
            button.addEventListener('click', (e) => {
                buttons.forEach(b => b.classList.remove('active'));
                button.classList.add('active');
                const modelPath = button.getAttribute('data-model');
                loadModel(modelPath);
            });
        });

        // --- 3. Логика трекинга ---
        function onResults(results) {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const lm = results.multiFaceLandmarks[0];
                
                // Точки глаз
                const leftEye = lm[33];
                const rightEye = lm[263];

                // 1. Вычисляем центр лица
                const cx = (leftEye.x + rightEye.x) / 2;
                const cy = (leftEye.y + rightEye.y) / 2;
                
                const SCENE_SCALE = 3.0; 

                targetPos.set(
                    (0.5 - cx) * SCENE_SCALE,  // Инверсия X для зеркала
                    (0.5 - cy) * -SCENE_SCALE, // Инверсия Y (в MP Y растет вниз, в 3D вверх)
                    0                          // Z пока 0, привязываем к плоскости лица
                );

                // 3. Масштаб
                const dx = rightEye.x - leftEye.x;
                const dy = rightEye.y - leftEye.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                targetScale = dist * 18; 
            }

            // Плавное движение (Lerp)
            glassesGroup.position.lerp(targetPos, 0.25);
            
            // Масштаб с учетом ползунка
            const uiScaleMult = parseFloat(document.getElementById('scaleRange').value) / 0.05;
            const finalTargetScale = targetScale * uiScaleMult;
            currentScale += (finalTargetScale - currentScale) * 0.25;
            glassesGroup.scale.setScalar(currentScale);

            // Поворот модели
            const uiRotY = parseFloat(document.getElementById('rotRange').value);
            if (currentModel) {
                currentModel.rotation.y = uiRotY;
            }

            renderer.render(scene, camera);
        }

        // --- 4. Запуск MediaPipe ---
        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);

        const camUtils = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({image: videoElement}); },
            width: 1280, height: 720
        });
        camUtils.start();

        // Обновление текста ползунков
        document.getElementById('scaleRange').oninput = (e) => document.getElementById('scaleVal').innerText = e.target.value;
        document.getElementById('rotRange').oninput = (e) => document.getElementById('rotVal').innerText = e.target.value;
        
        // Ресайз окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
